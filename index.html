<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cao Thắng Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#EDF0F0;--surface:#FFFFFF;--surface-2:#F6F8F8;
  --ink:#14202B;--ink-soft:#51626F;--ink-faint:#8697A2;
  --accent:#2F6690;--accent-warm:#C97A3D;--line:#D2DADE;
  --serif:'Fraunces',ui-serif,Georgia,serif;--sans:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--paper:#0F1620;--surface:#161F29;--surface-2:#1C2731;--ink:#E7ECEF;--ink-soft:#9FB0BC;--ink-faint:#66788599;--accent:#74B4DD;--accent-warm:#E0A464;--line:#2B3844;}
}
:root[data-theme="dark"]{--paper:#0F1620;--surface:#161F29;--surface-2:#1C2731;--ink:#E7ECEF;--ink-soft:#9FB0BC;--ink-faint:#66788599;--accent:#74B4DD;--accent-warm:#E0A464;--line:#2B3844;}
*{box-sizing:border-box;}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);margin:0;line-height:1.55;}
.wrap{max-width:760px;margin:0 auto;padding:60px 20px 80px;}
header{border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:32px;display:flex;align-items:baseline;gap:12px;}
.mark{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:5px;padding:3px 7px;}
h1{font-family:var(--serif);font-weight:600;font-size:26px;margin:0;text-wrap:balance;}
.sub{font-family:var(--mono);font-size:12px;color:var(--ink-soft);margin-top:6px;}
.list{display:flex;flex-direction:column;gap:14px;}
a.card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px;text-decoration:none;color:var(--ink);transition:border-color .15s;}
a.card:hover{border-color:var(--accent);}
a.card h2{font-family:var(--serif);font-size:18px;margin:0 0 6px;font-weight:600;}
a.card p{font-size:13.5px;color:var(--ink-soft);margin:0;}
a.card .go{font-family:var(--mono);font-size:11px;color:var(--accent-warm);margin-top:10px;display:block;}
a.card .pub{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-top:8px;display:block;}
footer.contact{position:fixed;right:16px;bottom:12px;font-family:var(--mono);font-size:11px;color:var(--ink-faint);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="mark">CT</span>
    <div>
      <h1>Cao Thắng Test</h1>
    </div>
  </header>
  <div class="list">
    <a class="card" href="/testdauvaotienganh">
      <h2>Test Đầu Vào Tiếng Anh</h2>
      <p>Thi trắc nghiệm tiếng Anh đầu vào — 5 đề, mỗi đề 50 câu, tự động chấm điểm.</p>
      <span class="pub">Ngày public: 11/09/2026</span>
      <span class="go">testdauvaotienganh &rarr;</span>
    </a>
    <!-- Them trang moi: dat file tai thu muc goc (vd. ten-trang.html) roi them mot the <a class="card"> moi o day -->
  </div>
  <footer class="contact">Contact: 0303261267@caothang.edu.vn</footer>
</div>
</body>
</html>
