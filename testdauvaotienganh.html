<style>
:root{
  --paper:#EDF0F0;--surface:#FFFFFF;--surface-2:#F6F8F8;
  --ink:#14202B;--ink-soft:#51626F;--ink-faint:#8697A2;
  --accent:#2F6690;--accent-ink:#FFFFFF;--accent-warm:#C97A3D;
  --line:#D2DADE;--good:#2F7A50;--good-bg:#E6F3EA;--bad:#AD4438;--bad-bg:#FBEAE7;
  --radius:10px;--serif:'Fraunces',ui-serif,Georgia,serif;--sans:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--paper:#0F1620;--surface:#161F29;--surface-2:#1C2731;--ink:#E7ECEF;--ink-soft:#9FB0BC;--ink-faint:#66788599;--accent:#74B4DD;--accent-ink:#0B1620;--accent-warm:#E0A464;--line:#2B3844;--good:#77D19B;--good-bg:#153323;--bad:#E7897C;--bad-bg:#3A1E1B;}
}
:root[data-theme="dark"]{--paper:#0F1620;--surface:#161F29;--surface-2:#1C2731;--ink:#E7ECEF;--ink-soft:#9FB0BC;--ink-faint:#66788599;--accent:#74B4DD;--accent-ink:#0B1620;--accent-warm:#E0A464;--line:#2B3844;--good:#77D19B;--good-bg:#153323;--bad:#E7897C;--bad-bg:#3A1E1B;}
*{box-sizing:border-box;}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);margin:0;line-height:1.55;}
::selection{background:var(--accent);color:var(--accent-ink);}
.wrap{max-width:1180px;margin:0 auto;padding:20px 20px 80px;display:grid;grid-template-columns:1fr 250px;gap:24px;}
@media (max-width:920px){.wrap{grid-template-columns:1fr;}}
header.top{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px 20px;padding:18px 4px 14px;border-bottom:2px solid var(--ink);margin-bottom:4px;}
.brand{display:flex;align-items:baseline;gap:12px;}
.brand .mark{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:5px;padding:3px 7px;}
.brand h1{font-family:var(--serif);font-weight:600;font-size:26px;margin:0;text-wrap:balance;}
.brand .sub{font-family:var(--mono);font-size:12px;color:var(--ink-soft);}
.examtabs{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.examtabs button{font-family:var(--mono);font-size:12.5px;padding:7px 12px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);cursor:pointer;}
.examtabs button.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.examtabs button:hover:not(.active){border-color:var(--accent);color:var(--ink);}
main{min-width:0;}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:28px 30px;max-width:760px;}
@media (max-width:600px){.paper{padding:20px 16px;}}
.exammeta{font-family:var(--mono);font-size:12px;color:var(--ink-soft);margin-bottom:18px;display:flex;gap:16px;flex-wrap:wrap;}
.parthead{display:flex;align-items:center;gap:10px;margin:34px 0 12px;}
.parthead:first-child{margin-top:0;}
.parthead .num{font-family:var(--mono);font-size:12px;background:var(--ink);color:var(--paper);border-radius:5px;padding:3px 8px;white-space:nowrap;}
.parthead h2{font-family:var(--serif);font-size:18px;margin:0;font-weight:600;}
.passage{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:16px 18px;font-size:15px;line-height:1.8;margin-bottom:14px;}
.passage h3{font-family:var(--serif);font-size:15.5px;margin:0 0 8px;}
.qitem{border-bottom:1px dashed var(--line);padding:14px 0;}
.qitem:last-child{border-bottom:none;}
.qhead{display:flex;gap:9px;font-size:15px;margin-bottom:9px;}
.qhead .qn{font-family:var(--mono);color:var(--accent);flex:none;}
.optrow{display:flex;flex-direction:column;gap:6px;margin-left:26px;}
.optlabel{display:flex;align-items:flex-start;gap:8px;font-size:14.5px;cursor:pointer;padding:4px 6px;border-radius:6px;}
.optlabel:hover{background:var(--surface-2);}
.optlabel input{margin-top:3px;accent-color:var(--accent);}
.optlabel.iscorrect{background:var(--good-bg);}
.optlabel.iswrong{background:var(--bad-bg);}
.result{margin-top:6px;margin-left:26px;font-size:12.5px;font-weight:600;}
.result.correct{color:var(--good);}
.result.incorrect{color:var(--bad);}
.submitbar{display:flex;justify-content:flex-end;gap:8px;margin-top:26px;}
.btn{font-family:var(--sans);font-weight:600;font-size:14.5px;background:var(--ink);color:var(--paper);border:none;border-radius:8px;padding:11px 22px;cursor:pointer;}
.btn:hover{background:var(--accent);color:var(--accent-ink);}
.btn.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line);}
.btn.secondary:hover{border-color:var(--accent);color:var(--accent);}
.btn.secondary.confirming{border-color:var(--bad);color:var(--bad);background:var(--bad-bg);}
.scoreband{background-color:var(--ink);color:var(--paper);border-radius:10px;padding:20px 24px;margin-top:20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.scoreband .big{font-family:var(--serif);font-size:38px;font-weight:600;}
.scoreband .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.75;}
aside{position:sticky;top:16px;align-self:start;display:flex;flex-direction:column;gap:16px;}
@media (max-width:920px){aside{position:static;}}
.navcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
.navcard h3{font-family:var(--serif);font-size:14px;margin:0 0 10px;color:var(--ink-soft);font-weight:600;}
.dotgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;}
.dot{font-family:var(--mono);font-size:10.5px;width:100%;aspect-ratio:1;border-radius:5px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.dot.answered{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.dot.correct{background:var(--good);border-color:var(--good);color:#fff;}
.dot.incorrect{background:var(--bad);border-color:var(--bad);color:#fff;}
.progresswrap{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:12px;}
.progressfill{height:100%;background:var(--accent-warm);border-radius:4px;transition:width .25s;}
.progresstxt{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-top:6px;}
.timerbox{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:20px;font-family:var(--mono);flex-wrap:wrap;}
.timerbox .t{font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:.03em;}
.timerbox button{font-family:var(--sans);font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:6px 11px;cursor:pointer;}
.timerbox button:hover{border-color:var(--accent);}
.timerhint{font-size:12.5px;color:var(--ink-soft);margin:-12px 0 24px;}
.timerhint b{color:var(--ink);font-weight:600;}
.themebtn{font-size:12px;font-family:var(--mono);border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:6px;padding:6px 10px;cursor:pointer;}
a{color:var(--accent);}
.headright{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
.headright-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.feedbacklink{font-family:var(--mono);font-size:11px;color:var(--ink-faint);text-decoration:none;}
.feedbacklink:hover{color:var(--accent);}
.cta-btn{font-family:var(--sans);font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:7px 12px;cursor:pointer;}
.cta-btn:hover{border-color:var(--accent);color:var(--accent);}
.cta-user{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--ink-soft);}
.cta-avatar{width:22px;height:22px;border-radius:50%;}
.cta-name{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cta-btn-out{padding:5px 9px;font-size:11.5px;}
.savebar{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap;}
.saveresultmsg{font-family:var(--mono);font-size:12.5px;color:var(--ink-soft);}
.saveresultmsg a{color:var(--accent);}
.sharedbanner{display:none;grid-column:1/-1;background:var(--surface-2);border:1px solid var(--accent);border-radius:8px;padding:12px 16px;font-size:13.5px;margin-bottom:-4px;}
.sharedbanner b{color:var(--accent);}
</style>
</head>

{title:"Campus Workshop Schedule & Safety Notice",text:"Starting next semester, the Faculty of Electrical and Electronics Engineering will implement a new digital schedule for all practical training sessions. Practical classes in Workshops A1 and A2 will run in two main shifts: the morning shift from 7:00 AM to 11:30 AM, and the afternoon shift from 1:00 PM to 5:30 PM.\n\nTo ensure student safety and equipment longevity, all students must check in using their student ID cards at the workshop entrance at least ten minutes before class begins. Late arrivals of more than 15 minutes will not be admitted and will be marked as absent.\n\nFurthermore, all personal belongings, including backpacks and mobile phones, must be placed in the designated storage lockers outside the workshop room. Students are only permitted to bring their notebooks, pens, and prescribed tool kits inside.",

     Q("What happens if a student arrives 20 minutes late?",["They will be fined money.","They will not be allowed inside and marked absent.","They can enter if they apologize.","They must do extra cleaning tasks."],1),

{title:"The Importance of Basic Electronics in Automation",text:"Automation has transformed modern manufacturing, enabling industries to produce goods with remarkable speed, precision, and efficiency. At the heart of every automated system lies a network of electronic components, sensors, and microcontrollers working together seamlessly.\n\nSensors act as the \"senses\" of a machine, detecting environmental changes such as temperature, pressure, light, and movement. This analog or digital information is then transmitted to a central controller, typically a Programmable Logic Controller (PLC) or an embedded microprocessor. The controller processes the incoming data according to programmed instructions and sends output commands to actuators—such as electric motors, valves, or hydraulic cylinders—to perform mechanical actions.\n\nFor technical students, mastering fundamental circuit analysis and electronic components is essential. Without a solid understanding of how current, voltage, and resistance interact, diagnosing faults in complex automated machinery becomes virtually impossible. As factories continue to adopt smart manufacturing technologies, engineers with strong foundations in both hardware electronics and programming will remain in high demand.",

     Q("Who is responsible for tools broken through improper handling?",["The tool crib technician.","The student who borrowed them.","The college security guard.","The entire class equally."],1)]},

/* ============ STATE ============ */
var state={examId:"e1",answers:{},submitted:{},timeLeft:{},timeTaken:{}};
try{var saved=JSON.parse(localStorage.getItem("mcqexam")||"{}");if(saved&&saved.answers)state=Object.assign(state,saved);}catch(e){}
function save(){try{localStorage.setItem("mcqexam",JSON.stringify(state));}catch(e){}}
function ansKey(n){return state.examId+"_"+n;}

/* ============ TIMER ============ */
var timer={running:false,handle:null};
function fmtTime(sec){var m=Math.floor(sec/60),s=sec%60;return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;}
function getTimeLeft(){return state.timeLeft[state.examId]!==undefined?state.timeLeft[state.examId]:60*60;}
function setTimeLeft(v){state.timeLeft[state.examId]=v;}

/* ============ RENDER ============ */
function renderTabs(){
  var et=document.getElementById("examTabs");et.innerHTML="";
  Object.keys(EXAMS).forEach(function(id){
    var b=document.createElement("button");
    b.textContent=EXAMS[id].title;
    if(id===state.examId)b.className="active";
    b.onclick=function(){state.examId=id;save();renderAll();};
    et.appendChild(b);
  });
}

function radioBlock(num,q){
  var html='<div class="qitem" data-q="'+num+'"><div class="qhead"><span class="qn">Câu '+num+'.</span><span>'+q.q+'</span></div><div class="optrow">';
  q.o.forEach(function(opt,oi){
    html+='<label class="optlabel" data-oi="'+oi+'"><input type="radio" name="q_'+num+'" value="'+oi+'" data-num="'+num+'">'+String.fromCharCode(65+oi)+'. '+opt+'</label>';
  });
  html+='</div><div class="result" id="fb'+num+'"></div></div>';
  return html;
}

function renderExam(){
  var exam=EXAMS[state.examId];
  document.getElementById("scoreCard").style.display=state.submitted[state.examId]?"block":"none";
  if(!state.submitted[state.examId])document.getElementById("scoreCardBody").innerHTML="";
  var html='';
  html+='<div class="exammeta"><span>50 CÂU · 60 PHÚT</span><span>PHẦN 1: Ngữ pháp &amp; Từ vựng (1-25)</span><span>PHẦN 2: Giao tiếp (26-32)</span><span>PHẦN 3: Điền từ (33-40)</span><span>PHẦN 4: Đọc hiểu (41-50)</span></div>';
  html+='<div class="timerbox"><span>Thoi gian</span><span class="t" id="timerDisplay">60:00</span><button id="timerBtn">Bat dau 60 phut</button></div>';
  html+='<p class="timerhint">Nhan vao nut <b>Bat dau 60 phut</b> de dem thoi gian khi lam bai. Khi lam xong, nhan nut <b>Nop bai</b>; muon lam lai tu dau thi nhan nut <b>Lam lai</b>.</p>';

  html+='<div class="parthead"><span class="num">PHẦN 1</span><h2>Ngữ pháp &amp; Từ vựng (Câu 1-25)</h2></div>';
  exam.p1.forEach(function(q,i){html+=radioBlock(i+1,q);});

  html+='<div class="parthead"><span class="num">PHẦN 2</span><h2>Tình huống giao tiếp (Câu 26-32)</h2></div>';
  exam.p2.forEach(function(q,i){html+=radioBlock(26+i,q);});

  html+='<div class="parthead"><span class="num">PHẦN 3</span><h2>Điền từ vào đoạn văn (Câu 33-40)</h2></div>';
  var n=33;
  exam.p3.forEach(function(para){
    html+='<div class="passage">'+para.text.replace(/\n/g,"<br><br>")+'</div>';
    para.qs.forEach(function(q){html+=radioBlock(n,q);n++;});
  });

  html+='<div class="parthead"><span class="num">PHẦN 4</span><h2>Đọc hiểu (Câu 41-50)</h2></div>';
  n=41;
  exam.p4.forEach(function(para){
    html+='<div class="passage"><h3>'+para.title+'</h3>'+para.text.replace(/\n/g,"<br><br>")+'</div>';
    para.qs.forEach(function(q){html+=radioBlock(n,q);n++;});
  });

  html+='<div class="submitbar"><button class="btn secondary" id="resetBtn">Lam lai</button><button class="btn" id="submitBtn">Nop bai</button></div>';
  html+='<div id="scoreBanner"></div>';

  document.getElementById("content").innerHTML=html;

  document.querySelectorAll('input[type=radio][data-num]').forEach(function(rad){
    var num=rad.dataset.num,k=ansKey(num);
    if(state.answers[k]!==undefined && state.answers[k]==rad.value)rad.checked=true;
    rad.onchange=function(){state.answers[k]=rad.value;save();updateNav();};
  });

  document.getElementById("submitBtn").onclick=function(){gradeExam();};

  var resetBtn=document.getElementById("resetBtn");
  var resetArmed=false,resetTimeout=null;
  resetBtn.onclick=function(){
    if(!resetArmed){
      resetArmed=true;
      resetBtn.textContent="Bam lai de xac nhan xoa";
      resetBtn.classList.add("confirming");
      resetTimeout=setTimeout(function(){
        resetArmed=false;
        resetBtn.textContent="Lam lai";
        resetBtn.classList.remove("confirming");
      },4000);
      return;
    }
    clearTimeout(resetTimeout);
    resetArmed=false;
    Object.keys(state.answers).forEach(function(k){if(k.indexOf(state.examId+"_")===0)delete state.answers[k];});
    state.submitted[state.examId]=false;
    delete state.timeLeft[state.examId];
    delete state.timeTaken[state.examId];
    save();
    timer.running=false;clearInterval(timer.handle);
    document.getElementById("scoreCard").style.display="none";
    document.getElementById("scoreCardBody").innerHTML="";
    renderAll();
  };

  setupTimer();
  if(state.submitted[state.examId])gradeExam(true);
  updateNav();
}

function allQuestionsFlat(exam){
  var arr=[];
  exam.p1.forEach(function(q,i){arr.push({num:i+1,q:q});});
  exam.p2.forEach(function(q,i){arr.push({num:26+i,q:q});});
  var n=33;
  exam.p3.forEach(function(para){para.qs.forEach(function(q){arr.push({num:n,q:q});n++;});});
  n=41;
  exam.p4.forEach(function(para){para.qs.forEach(function(q){arr.push({num:n,q:q});n++;});});
  return arr;
}

function gradeExam(silent){
  timer.running=false;clearInterval(timer.handle);
  if(!silent){
    state.timeTaken[state.examId]=60*60-getTimeLeft();
    save();
  }
  var btn=document.getElementById("timerBtn");
  if(btn){btn.textContent="Da nop bai";btn.disabled=true;}
  var exam=EXAMS[state.examId];
  var flat=allQuestionsFlat(exam);
  var correct=0,total=flat.length;

  flat.forEach(function(item){
    var num=item.num,k=ansKey(num),v=state.answers[k];
    var ok=(v!==undefined && +v===item.q.a);
    if(ok)correct++;
    var qitem=document.querySelector('.qitem[data-q="'+num+'"]');
    if(!qitem)return;
    qitem.querySelectorAll('.optlabel').forEach(function(lab){
      lab.classList.remove("iscorrect","iswrong");
      var oi=+lab.dataset.oi;
      if(oi===item.q.a)lab.classList.add("iscorrect");
      else if(v!==undefined && +v===oi)lab.classList.add("iswrong");
    });
    var fb=document.getElementById("fb"+num);
    if(fb)fb.innerHTML=ok?'<span class="result correct">Chinh xac</span>':'<span class="result incorrect">Dap an dung: '+String.fromCharCode(65+item.q.a)+'. '+item.q.o[item.q.a]+'</span>';
  });

  state.submitted[state.examId]=true;save();

  var pct=Math.round(correct/total*100);
  var band=pct>=90?"Xuat sac":pct>=70?"Kha - dat yeu cau dau vao":pct>=50?"Trung binh, can on tap them":"Can hoc lai kien thuc co ban";
  var taken=state.timeTaken[state.examId];
  var timeHtml=taken!==undefined?'<div><div class="lbl">Thoi gian lam bai</div><div class="big">'+fmtTime(taken)+'</div></div>':'';
  document.getElementById("scoreBanner").innerHTML='<div class="scoreband"><div><div class="lbl">Diem so</div><div class="big">'+correct+' / '+total+'</div></div><div><div class="lbl">Ti le dung</div><div class="big">'+pct+'%</div></div>'+timeHtml+'<div style="max-width:200px;font-size:13px;opacity:.85">'+band+'</div></div><div class="savebar"><button class="btn secondary" type="button" id="saveResultBtn">Luu ket qua</button><span class="saveresultmsg" id="saveResultMsg"></span></div>';

  document.getElementById("scoreCard").style.display="block";
  document.getElementById("scoreCardBody").innerHTML='<div style="font-family:var(--mono);font-size:26px;font-weight:600;color:var(--accent)">'+correct+'/'+total+'</div><div style="font-size:12px;color:var(--ink-soft);margin-top:4px">'+pct+'% chinh xac</div>'+(taken!==undefined?'<div style="font-size:12px;color:var(--ink-soft);margin-top:4px">Thoi gian: '+fmtTime(taken)+'</div>':'');

  setupSaveResult(exam,correct,total,pct,taken);
  updateNav();
  if(!silent){var sb=document.getElementById("scoreBanner");if(sb)sb.scrollIntoView({behavior:"smooth",block:"nearest"});}
}

function setupSaveResult(exam,correct,total,pct,taken){
  var saveBtn=document.getElementById("saveResultBtn");
  var msg=document.getElementById("saveResultMsg");
  if(!saveBtn||!window.CaoThangAuth)return;

  function doSave(){
    msg.textContent="Dang luu...";
    CaoThangAuth.saveResult({
      examId:state.examId,
      examTitle:exam.title,
      correct:correct,total:total,pct:pct,
      timeTaken:taken!==undefined?taken:null
    }).then(function(id){
      var url=location.origin+location.pathname+"?result="+id;
      var text="Toi vua lam "+exam.title+" duoc "+correct+"/"+total+" cau dung! Thu suc tai:";
      msg.innerHTML='Da luu ket qua! <button class="cta-btn" type="button" id="shareBtn">Chia se</button> <button class="cta-btn" type="button" id="copyLinkBtn">Copy link</button>';
      document.getElementById("shareBtn").onclick=function(){
        if(navigator.share){
          navigator.share({title:"Ket qua "+exam.title,text:text,url:url}).catch(function(){});
        }else{
          window.open("https://www.facebook.com/sharer/sharer.php?u="+encodeURIComponent(url),"_blank","noopener");
        }
      };
      var copyBtn=document.getElementById("copyLinkBtn");
      copyBtn.onclick=function(){
        navigator.clipboard.writeText(url).then(function(){copyBtn.textContent="Da copy!";});
      };
    }).catch(function(err){
      msg.textContent="Loi: "+(err&&err.message?err.message:err);
    });
  }

  saveBtn.onclick=function(){
    if(!CaoThangAuth.getUser()){
      msg.textContent="Dang mo dang nhap Google...";
      CaoThangAuth.signIn().then(doSave).catch(function(err){
        msg.textContent="Dang nhap that bai: "+(err&&err.message?err.message:err);
      });
      return;
    }
    doSave();
  };
}

function showSharedResult(){
  if(!window.CaoThangAuth)return;
  var params=new URLSearchParams(location.search);
  var rid=params.get("result");
  if(!rid)return;
  CaoThangAuth.loadResult(rid).then(function(data){
    if(!data)return;
    var el=document.getElementById("sharedResultBanner");
    if(!el)return;
    el.style.display="block";
    el.innerHTML='Ket qua da chia se cua <b>'+(data.name||data.email||"mot ban")+'</b>: <b>'+data.correct+'/'+data.total+'</b> ('+data.pct+'%) &middot; '+(data.examTitle||data.examId)+(data.timeTaken!=null?' &middot; Thoi gian: '+fmtTime(data.timeTaken):'');
  }).catch(function(){});
}

function setupTimer(){
  var disp=document.getElementById("timerDisplay"),btn=document.getElementById("timerBtn");
  timer.running=false;clearInterval(timer.handle);
  function render(){disp.textContent=fmtTime(getTimeLeft());}
  render();

  if(state.submitted[state.examId]){
    btn.textContent="Da nop bai";btn.disabled=true;
    return;
  }
  btn.disabled=false;
  btn.textContent=getTimeLeft()<60*60?"Tiep tuc":"Bat dau 60 phut";

  btn.onclick=function(){
    if(timer.running){
      timer.running=false;clearInterval(timer.handle);btn.textContent="Tiep tuc";
    }else{
      timer.running=true;btn.textContent="Tam dung";
      timer.handle=setInterval(function(){
        var left=getTimeLeft()-1;
        setTimeLeft(left);save();
        if(left<=0){setTimeLeft(0);clearInterval(timer.handle);timer.running=false;btn.textContent="Het gio";}
        render();
      },1000);
    }
  };
}

function updateNav(){
  var grid=document.getElementById("dotGrid");grid.innerHTML="";
  var answered=0,total=50;
  for(var n=1;n<=50;n++){
    var k=ansKey(n);
    var d=document.createElement("div");d.className="dot";d.textContent=n;
    var v=state.answers[k];
    var has=(v!==undefined && v!=="");
    if(has){d.classList.add("answered");answered++;}
    if(state.submitted[state.examId] && has){
      var isOk=checkCorrect(n,v);
      d.classList.remove("answered");
      d.classList.add(isOk?"correct":"incorrect");
    }
    d.onclick=(function(num){return function(){
      var el=document.querySelector('.qitem[data-q="'+num+'"]');
      if(el)el.scrollIntoView({behavior:"smooth",block:"center"});
    };})(n);
    grid.appendChild(d);
  }
  document.getElementById("progressFill").style.width=Math.round(answered/total*100)+"%";
  document.getElementById("progressTxt").textContent=answered+"/50 da tra loi";
}

function checkCorrect(num,v){
  var exam=EXAMS[state.examId];
  var flat=allQuestionsFlat(exam);
  var item=flat[num-1];
  return item && +v===item.q.a;
}

/* ============ THEME ============ */
function cycleTheme(){
  var root=document.documentElement;
  var cur=root.getAttribute("data-theme");
  var next=cur==="dark"?"light":cur==="light"?null:"dark";
  if(next)root.setAttribute("data-theme",next);else root.removeAttribute("data-theme");
  var label=next==="dark"?"Giao dien: Toi":next==="light"?"Giao dien: Sang":"Giao dien: He thong";
  document.getElementById("themeBtn").textContent=label;
  try{localStorage.setItem("mcqtheme",next||"");}catch(e){}
}
(function(){try{var t=localStorage.getItem("mcqtheme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();

function renderAll(){renderTabs();renderExam();}
document.addEventListener("DOMContentLoaded",function(){
  var t=null;try{t=localStorage.getItem("mcqtheme");}catch(e){}
  if(t)document.getElementById("themeBtn").textContent="Giao dien: "+(t==="dark"?"Toi":"Sang");
  document.getElementById("themeBtn").onclick=cycleTheme;
  renderAll();
  if(window.CaoThangAuth){
    CaoThangAuth.renderWidget(document.getElementById("authWidget"));
    showSharedResult();
  }
});
</script>
